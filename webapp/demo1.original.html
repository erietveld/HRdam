<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Demo 1</title>
<style>
:root{--bg:#ffffff;--bg2:#e8eff4;--ink:#062b41;--ink2:#4a6577;--sage:#c4f0bc;--sn:#62d84e}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);
  font-family:ui-rounded,"SF Pro Rounded","Avenir Next","Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;color:var(--ink)}
.slide{position:absolute;inset:0;padding:100px 120px 90px;box-shadow:inset 0 16px 0 var(--ink);display:flex;flex-direction:column;background:var(--bg)}
.badge{display:inline-block;background:var(--ink);color:var(--sn);font-size:44px;font-weight:800;padding:12px 40px;border-radius:999px;letter-spacing:.06em}
.small{font-size:32px;color:var(--ink2)}
.prompt{margin-top:50px;background:#073049;color:#e8f3fa;border-radius:36px;padding:50px 60px;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:54px;line-height:1.4;position:relative}
.prompt:before{content:"> prompt";position:absolute;top:-22px;left:44px;background:var(--sn);color:var(--ink);font-size:24px;font-weight:800;padding:4px 18px;border-radius:999px;font-family:inherit}
.value{margin-top:auto;display:flex;gap:28px;align-items:center;background:#e6f8e2;border:3px solid var(--sage);border-radius:32px;padding:30px 44px;font-size:46px;font-weight:700;line-height:1.2}
.value .e{font-size:84px}
</style>
</head>
<body>
<section class="slide">
  <div><span class="badge">DEMO 1</span> <span class="small" style="margin-left:20px;font-size:40px">Ook deze presentatie is gevibecoded</span></div>
  <div class="prompt" style="font-size:64px;margin-top:80px">Pas de Demo 1 slide aan: voeg katjes toe die hem langzaam opeten.</div>
  <div class="value"><span class="e">🐱</span><span>Van idee naar iets werkends in minuten, gewoon door in gewone taal te zeggen wat je wilt.</span></div>
</section>
</body>
</html>
